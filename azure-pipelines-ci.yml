# Build, test and pack the sdcm .NET tool, publishing the .nupkg as a build artifact
# https://learn.microsoft.com/azure/devops/pipelines/ecosystems/dotnet-core

pool:
  vmImage: 'windows-latest'

variables:
  buildConfiguration: 'Release'

name: 2.$(Date:yyyy).$(Date:MMdd).$(Rev:r)

steps:
- task: UseDotNet@2
  displayName: 'Use .NET 10 SDK'
  inputs:
    packageType: 'sdk'
    version: '10.0.x'

- task: DotNetCoreCLI@2
  displayName: 'Restore'
  inputs:
    command: 'restore'
    projects: 'SurfaceDevCenterManager.slnx'

- task: DotNetCoreCLI@2
  displayName: 'Build'
  inputs:
    command: 'build'
    projects: 'SurfaceDevCenterManager.slnx'
    arguments: '--configuration $(buildConfiguration) --no-restore -p:Version=$(Build.BuildNumber)'

- task: DotNetCoreCLI@2
  displayName: 'Test'
  inputs:
    command: 'test'
    projects: 'SurfaceDevCenterManager.slnx'
    arguments: '--configuration $(buildConfiguration) --no-build'

- task: DotNetCoreCLI@2
  displayName: 'Pack'
  inputs:
    command: 'pack'
    packagesToPack: 'src/SurfaceDevCenterManager/SurfaceDevCenterManager.csproj'
    configuration: '$(buildConfiguration)'
    nobuild: true
    versioningScheme: 'byBuildNumber'

- task: PublishBuildArtifacts@1
  inputs:
    PathToPublish: '$(Build.ArtifactStagingDirectory)'
    ArtifactName: 'drop'
