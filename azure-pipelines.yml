# Build, test and pack the sdcm .NET tool
# https://learn.microsoft.com/azure/devops/pipelines/ecosystems/dotnet-core

pool:
  vmImage: 'windows-latest'

variables:
  buildConfiguration: 'Release'

steps:
- task: UseDotNet@2
  displayName: 'Use .NET 10 SDK'
  inputs:
    packageType: 'sdk'
    version: '10.0.x'

- task: DotNetCoreCLI@2
  displayName: 'Restore'
  inputs:
    command: 'restore'
    projects: 'SurfaceDevCenterManager.slnx'

- task: DotNetCoreCLI@2
  displayName: 'Build'
  inputs:
    command: 'build'
    projects: 'SurfaceDevCenterManager.slnx'
    arguments: '--configuration $(buildConfiguration) --no-restore'

- task: DotNetCoreCLI@2
  displayName: 'Test'
  inputs:
    command: 'test'
    projects: 'SurfaceDevCenterManager.slnx'
    arguments: '--configuration $(buildConfiguration) --no-build'

- task: DotNetCoreCLI@2
  displayName: 'Pack'
  inputs:
    command: 'pack'
    packagesToPack: 'src/SurfaceDevCenterManager/SurfaceDevCenterManager.csproj'
    configuration: '$(buildConfiguration)'
    nobuild: true
    versioningScheme: 'off'
